# Hooks run on our own files only; upstream Gibbon/ERPNext code is never committed (D15).
# Hook revisions are pinned; Renovate updates them from S1.
default_install_hook_types: [pre-commit, commit-msg]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: detect-private-key

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        exclude: ^LICENSE$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        args: [--external-sources]

  - repo: local
    hooks:
      - id: check-docs
        name: AGENTS index, instruction sizes, templates, mermaid blocks
        entry: mise exec -- python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: \.md$|^scripts/check_docs\.py$
      - id: branch-name
        name: Branch name follows git.instructions.md
        entry: mise exec -- python scripts/hooks/branch_name.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commit-msg
        name: Plain-sentence commit message, no AI co-author trailers
        entry: mise exec -- python scripts/hooks/commit_msg.py
        language: system
        stages: [commit-msg]
      - id: trivy-secret
        name: Trivy secret scan
        entry: mise exec -- trivy fs --scanners secret --exit-code 1 --quiet --skip-dirs .git .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
