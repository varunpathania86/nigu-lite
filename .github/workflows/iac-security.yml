name: Advisory IaC security
on:
  pull_request:
    paths:
      - core/**
      - erp/**
      - edu/**
      - deployments/**
      - policy/**
      - versions.yml
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NIGU_LOCAL_MODE: commit

jobs:
  scan:
    name: Rendered IaC security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make container-iac MODE="$NIGU_LOCAL_MODE" BASE=origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: iac-security-report-${{ github.run_number }}
          path: report/act
          retention-days: 14
  report:
    name: Report
    needs: scan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: iac-security-report-${{ github.run_number }}
          path: report/parts
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: make container-report MODE="$NIGU_LOCAL_MODE" BASE=HEAD WORKFLOW=iac-security
      - run: cat report/act/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-report-${{ github.run_number }}
          path: |
            report/act/report.md
            report/act/report.html
            report/act/report.json
            report/parts
          retention-days: 14
